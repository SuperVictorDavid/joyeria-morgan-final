# Joyeria Morgan - stack completo (U2 Docker + U1/U3)
# Uso: docker compose -f docker-compose.full.yml up -d --build
# No requiere jars compilados: cada Dockerfile compila dentro de la imagen.
name: joyeria-morgan

# Variables comunes a los 5 backends: dentro de la red Docker los hosts son
# los nombres de servicio (mysql, eureka-server, config-server).
x-backend-env: &backend-env
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_USER: app
  DB_PASSWORD: password
  EUREKA_URL: http://eureka-server:8761/eureka/
  CONFIG_SERVER_URL: http://config-server:8888
  JWT_SECRET: cibertec-demo-jwt-secret-key-2026-minimo-32-caracteres
  SPRING_PROFILES_ACTIVE: default

x-messaging-env: &messaging-env
  KAFKA_BOOTSTRAP: kafka:29092
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: guest
  RABBITMQ_PASSWORD: guest

services:
  mysql:
    image: mysql:8.0
    container_name: joyeria-mysql
    restart: always
    environment:
      MYSQL_DATABASE: joyeria_db
      MYSQL_USER: app
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: password
    ports:
      - "5510:3306"
    volumes:
      - joyeria-db:/var/lib/mysql
    networks:
      - net-joyeria
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ppassword"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    container_name: joyeria-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - net-joyeria
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: joyeria-zookeeper
    # Si el PC se apaga de golpe, al volver arranca solo y libera la sesion vieja.
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper
    networks:
      - net-joyeria

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: joyeria-kafka
    # Reintenta si Kafka sale con "NodeExists" por un apagado brusco.
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - net-joyeria

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: joyeria-kafka-ui
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: ligo-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - net-joyeria

  eureka-server:
    build: ./infra/eureka-server
    container_name: joyeria-eureka
    ports:
      - "8761:8761"
    networks:
      - net-joyeria

  config-server:
    build: ./infra/config-server
    container_name: joyeria-config
    ports:
      - "8888:8888"
    depends_on:
      - eureka-server
    networks:
      - net-joyeria

  auth-service:
    build: ./backend/auth-service
    container_name: joyeria-auth
    environment:
      <<: *backend-env
    ports:
      - "8083:8083"
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
      config-server:
        condition: service_started
    networks:
      - net-joyeria

  clientes-service:
    build: ./backend/clientes-service
    container_name: joyeria-clientes
    environment:
      <<: *backend-env
    ports:
      - "8084:8084"
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
      config-server:
        condition: service_started
    networks:
      - net-joyeria

  inventario-service:
    build: ./backend/inventario-service
    container_name: joyeria-inventario
    environment:
      <<: [*backend-env, *messaging-env]
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_started
      config-server:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - net-joyeria

  ventas-service:
    build: ./backend/ventas-service
    container_name: joyeria-ventas
    environment:
      <<: [*backend-env, *messaging-env]
    ports:
      - "8082:8082"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_started
      config-server:
        condition: service_started
      kafka:
        condition: service_started
      inventario-service:
        condition: service_started
    networks:
      - net-joyeria

  reportes-service:
    build: ./backend/reportes-service
    container_name: joyeria-reportes
    environment:
      <<: *backend-env
      INVENTARIO_URL: http://inventario-service:8081
      VENTAS_URL: http://ventas-service:8082
      CLIENTES_URL: http://clientes-service:8084
    ports:
      - "8085:8085"
    depends_on:
      eureka-server:
        condition: service_started
      config-server:
        condition: service_started
      inventario-service:
        condition: service_started
      ventas-service:
        condition: service_started
      clientes-service:
        condition: service_started
    networks:
      - net-joyeria

  api-gateway:
    build: ./infra/api-gateway
    container_name: joyeria-gateway
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://eureka-server:8761/eureka/
      CORS_ORIGINS: http://localhost:4200
    ports:
      - "8762:8762"
    depends_on:
      eureka-server:
        condition: service_started
      config-server:
        condition: service_started
      auth-service:
        condition: service_started
      clientes-service:
        condition: service_started
      inventario-service:
        condition: service_started
      ventas-service:
        condition: service_started
      reportes-service:
        condition: service_started
    networks:
      - net-joyeria

  frontend:
    build: ./frontend/joyeria-front
    container_name: joyeria-frontend
    ports:
      - "4200:80"
    depends_on:
      api-gateway:
        condition: service_started
    networks:
      - net-joyeria

volumes:
  joyeria-db:
  rabbitmq-data:
  zookeeper-data:
  kafka-data:

networks:
  net-joyeria:
    name: net-joyeria
