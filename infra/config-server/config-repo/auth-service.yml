spring:
  application:
    name: auth-service
  datasource:
    url: "jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:5510}/joyeria_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima"
    username: ${DB_USER:app}
    password: ${DB_PASSWORD:password}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 8083
  error:
    # Muestra el motivo real (Kafka, stock, validacion) en el JSON de error.
    include-message: always

app:
  jwt:
    secret: "${JWT_SECRET:cibertec-demo-jwt-secret-key-2026-minimo-32-caracteres}"
    expiration-minutes: 60

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: "${EUREKA_URL:http://localhost:8761/eureka/}"
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
