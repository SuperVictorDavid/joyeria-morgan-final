spring:
  application:
    name: ventas-service
  datasource:
    url: "jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:5510}/joyeria_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima"
    username: ${DB_USER:app}
    password: ${DB_PASSWORD:password}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  kafka:
    bootstrap-servers: "${KAFKA_BOOTSTRAP:localhost:9092}"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        max.block.ms: 2000
        delivery.timeout.ms: 5000
        request.timeout.ms: 3000
        retries: 0
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

app:
  jwt:
    secret: "${JWT_SECRET:cibertec-demo-jwt-secret-key-2026-minimo-32-caracteres}"

server:
  port: 8082
  error:
    # Muestra el motivo real (Kafka, stock, validacion) en el JSON de error.
    include-message: always

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: "${EUREKA_URL:http://localhost:8761/eureka/}"
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      show-details: always

messaging:
  kafka:
    enabled: true
  rabbitmq:
    stock:
      enabled: true
  consumers:
    enabled: true

resilience4j:
  circuitbreaker:
    instances:
      inventario-service:
        sliding-window-size: 5
        failure-rate-threshold: 60
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 1
        automatic-transition-from-open-to-half-open-enabled: true
  retry:
    instances:
      inventario-service:
        max-attempts: 3
        wait-duration: 500ms
