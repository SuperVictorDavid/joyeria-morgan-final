spring:
  application:
    name: reportes-service

app:
  jwt:
    secret: "${JWT_SECRET:cibertec-demo-jwt-secret-key-2026-minimo-32-caracteres}"

servicios:
  inventario-url: "${INVENTARIO_URL:http://localhost:8081}"
  ventas-url: "${VENTAS_URL:http://localhost:8082}"
  clientes-url: "${CLIENTES_URL:http://localhost:8084}"

server:
  port: 8085
  error:
    # Muestra el motivo real (Kafka, stock, validacion) en el JSON de error.
    include-message: always

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: "${EUREKA_URL:http://localhost:8761/eureka/}"
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
