server:
  port: 8762

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/auth/**,/users/**
        - id: clientes-service
          uri: lb://clientes-service
          predicates:
            - Path=/customers/**
        - id: inventario-service
          uri: lb://inventario-service
          predicates:
            - Path=/products/**
        - id: ventas-service
          uri: lb://ventas-service
          predicates:
            - Path=/sales/**
        - id: reportes-service
          uri: lb://reportes-service
          predicates:
            - Path=/reports/**
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:4200"
            allowedMethods: "GET,POST,PUT,DELETE,OPTIONS"
            allowedHeaders: "*"
            allowCredentials: true

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
