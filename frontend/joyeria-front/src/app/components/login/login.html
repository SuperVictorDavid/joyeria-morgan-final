<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h2>💎 Joyería Morgan</h2>
      <p class="subtitle">Inventario y Ventas</p>
    </div>

    <div *ngIf="errorMessage" class="alert-error">
      {{ errorMessage }}
    </div>

    <form (ngSubmit)="onLogin()">
      <div class="form-group">
        <label for="username">Usuario / Operador (*):</label>
        <input
          type="text"
          id="username"
          [(ngModel)]="username"
          name="username"
          (input)="errorMessage = ''"
          placeholder="Ej: admin / vendedor"
          required
          autofocus
        />
      </div>

      <div class="form-group">
        <label for="password">Contraseña (*):</label>
        <input
          type="password"
          id="password"
          [(ngModel)]="password"
          name="password"
          (input)="errorMessage = ''"
          placeholder="••••••••"
          required
        />
      </div>

      <button type="submit" class="btn-submit" [disabled]="isLoading">
        <span *ngIf="!isLoading">Ingresar al Sistema</span>
        <span *ngIf="isLoading">Validando</span>
      </button>
    </form>

    <div class="login-footer">
      <small>Acceso restringido para personal autorizado</small>
    </div>
  </div>
</div>
