# nginx del frontend: sirve Angular y proxya /api hacia el API Gateway.
# Asi el bundle de produccion no lleva hosts ni puertos de los microservicios.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Rutas de Angular (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # /api/products -> http://api-gateway:8762/products
    location /api/ {
        proxy_pass http://api-gateway:8762/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
