apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: joyeria/api-gateway:1.0
        imagePullPolicy: Never
        ports:
        - containerPort: 8762
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "default"
        - name: EUREKA_URL
          value: "http://eureka-server:8761/eureka/"
        - name: CONFIG_SERVER_URL
          value: "http://config-server:8888"
        - name: CORS_ORIGINS
          value: "http://localhost:4200"
