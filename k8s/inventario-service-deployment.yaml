apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventario-service
  labels:
    app: inventario-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventario-service
  template:
    metadata:
      labels:
        app: inventario-service
    spec:
      containers:
      - name: inventario-service
        image: joyeria/inventario-service:1.0
        imagePullPolicy: Never
        ports:
        - containerPort: 8081
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "default"
        - name: DB_HOST
          value: "joyeria-mysql"
        - name: DB_PORT
          value: "3306"
        - name: DB_USER
          value: "app"
        - name: DB_PASSWORD
          value: "password"
        - name: EUREKA_URL
          value: "http://eureka-server:8761/eureka/"
        - name: CONFIG_SERVER_URL
          value: "http://config-server:8888"
        # Kafka/Rabbit no vienen en k8s/: usar docker-compose.full.yml o desplegar los brokers.
        - name: KAFKA_BOOTSTRAP
          value: "kafka:9092"
        - name: RABBITMQ_HOST
          value: "rabbitmq"
