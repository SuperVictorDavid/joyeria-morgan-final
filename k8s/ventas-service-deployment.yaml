apiVersion: apps/v1
kind: Deployment
metadata:
  name: ventas-service
  labels:
    app: ventas-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ventas-service
  template:
    metadata:
      labels:
        app: ventas-service
    spec:
      containers:
      - name: ventas-service
        image: joyeria/ventas-service:1.0
        imagePullPolicy: Never
        ports:
        - containerPort: 8082
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "default"
