apiVersion: apps/v1
kind: Deployment
metadata:
  name: clientes-service
  labels:
    app: clientes-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clientes-service
  template:
    metadata:
      labels:
        app: clientes-service
    spec:
      containers:
      - name: clientes-service
        image: joyeria/clientes-service:1.0
        imagePullPolicy: Never
        ports:
        - containerPort: 8084
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "default"
