apiVersion: apps/v1
kind: Deployment
metadata:
  name: clientes-service
  labels:
    app: clientes-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clientes-service
  template:
    metadata:
      labels:
        app: clientes-service
    spec:
      containers:
      - name: clientes-service
        image: joyeria/clientes-service:1.0
        imagePullPolicy: Never
        ports:
        - containerPort: 8084
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "default"
        - name: DB_HOST
          value: "joyeria-mysql"
        - name: DB_PORT
          value: "3306"
        - name: DB_USER
          value: "app"
        - name: DB_PASSWORD
          value: "password"
        - name: EUREKA_URL
          value: "http://eureka-server:8761/eureka/"
        - name: CONFIG_SERVER_URL
          value: "http://config-server:8888"
