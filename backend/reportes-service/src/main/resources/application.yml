spring:
  application:
    name: reportes-service

app:
  jwt:
    secret: "cibertec-demo-jwt-secret-key-2026-minimo-32-caracteres"

server:
  port: 8085

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
