spring:
  application:
    name: ventas-service
  datasource:
    url: jdbc:mysql://localhost:5510/joyeria_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
    username: app
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        max.block.ms: 2000
        delivery.timeout.ms: 5000
        request.timeout.ms: 3000
        retries: 0
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  config:
    # Config Server (T3): si no esta arriba, el servicio arranca con este application.yml.
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"

app:
  jwt:
    secret: "cibertec-demo-jwt-secret-key-2026-minimo-32-caracteres"

server:
  port: 8082
  error:
    # Muestra el motivo real (Kafka, stock, validacion) en el JSON de error.
    include-message: always

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      show-details: always

messaging:
  kafka:
    enabled: true
  rabbitmq:
    stock:
      enabled: true
  consumers:
    enabled: true

resilience4j:
  circuitbreaker:
    instances:
      inventario-service:
        sliding-window-size: 5
        failure-rate-threshold: 60
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 1
        automatic-transition-from-open-to-half-open-enabled: true
  retry:
    instances:
      inventario-service:
        max-attempts: 3
        wait-duration: 500ms
