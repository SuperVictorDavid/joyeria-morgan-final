spring:
  application:
    name: clientes-service
  datasource:
    url: jdbc:mysql://localhost:5510/joyeria_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
    username: app
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  config:
    # Config Server (T3): si no esta arriba, el servicio arranca con este application.yml.
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"

app:
  jwt:
    secret: "cibertec-demo-jwt-secret-key-2026-minimo-32-caracteres"

server:
  port: 8084
  error:
    # Muestra el motivo real (Kafka, stock, validacion) en el JSON de error.
    include-message: always

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
